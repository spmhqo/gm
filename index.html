<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Conversation</title>
  <style>
    :root { --ink:#172033; --muted:#65708a; --line:#dfe4ee; --page:#f6f8fc; --user:#eef5ff; --assistant:#fff; --accent:#1769e0; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--page); color:var(--ink); font-family:"Noto Sans Bengali", "Hind Siliguri", system-ui, sans-serif; }
    main { width:min(100%, 1120px); margin:auto; padding:clamp(12px, 3vw, 36px); }
    .message { background:var(--assistant); border:1px solid var(--line); border-radius:16px; margin:0 0 18px; overflow:hidden; box-shadow:0 3px 12px #1720330a; }
    .message.user { background:var(--user); border-color:#cbdcf9; }
    .message__head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); }
    .speaker { font-weight:750; font-size:.92rem; letter-spacing:.02em; }
    .copy { appearance:none; border:0; border-radius:9px; background:var(--accent); color:#fff; cursor:pointer; font:inherit; font-size:.86rem; font-weight:650; padding:8px 12px; white-space:nowrap; }
    .copy:focus-visible { outline:3px solid #ffb000; outline-offset:2px; }
    .message__body { margin:0; padding:16px; white-space:pre-wrap; overflow-wrap:anywhere; font:400 clamp(.96rem, 1.6vw, 1.04rem)/1.72 ui-monospace, "Noto Sans Bengali", monospace; }
    .table-wrap { overflow-x:auto; margin:0 16px 16px; border:1px solid var(--line); border-radius:10px; -webkit-overflow-scrolling:touch; }
    table { width:100%; min-width:760px; border-collapse:collapse; background:#fff; font:400 .94rem/1.6 "Noto Sans Bengali", system-ui, sans-serif; }
    th,td { padding:12px; text-align:left; vertical-align:top; border-right:1px solid var(--line); border-bottom:1px solid var(--line); overflow-wrap:anywhere; }
    th { background:#edf2fa; font-weight:750; }
    tr:last-child td { border-bottom:0; } th:last-child,td:last-child { border-right:0; }
    .loading { color:var(--muted); text-align:center; padding:35px; }
    @media (max-width:480px) { main{padding:8px;} .message{border-radius:12px;margin-bottom:10px;} .message__head,.message__body{padding:12px;} .message__body{font-size:.92rem;line-height:1.62;} }
  </style>
</head>
<body>
  <main id="conversation" aria-live="polite"><p class="loading">Loading…</p></main>
  <script src="./transcript.js"></script>
  <script>
    const root = document.querySelector('#conversation');
    const escapeHtml = (value) => value.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function addMessage(speaker, body) {
      const card = document.createElement('section');
      const isUser = speaker === 'You';
      card.className = `message ${isUser ? 'user' : 'assistant'}`;
      card.innerHTML = `<div class="message__head"><span class="speaker">${escapeHtml(speaker)}</span>${isUser ? '<button class="copy" type="button">Copy Prompt</button>' : ''}</div>`;
      const lines = body.split(/\r?\n/); let plain = [];
      const flushPlain = () => { if (!plain.length) return; const pre = document.createElement('pre'); pre.className = 'message__body'; pre.textContent = plain.join('\n'); card.append(pre); plain = []; };
      for (let i = 0; i < lines.length;) {
        if (!lines[i].includes('\t')) { plain.push(lines[i++]); continue; }
        const rows = []; while (i < lines.length && lines[i].includes('\t')) rows.push(lines[i++].split('\t'));
        flushPlain(); const wrap = document.createElement('div'); wrap.className = 'table-wrap'; const table = document.createElement('table');
        const head = document.createElement('thead'), header = document.createElement('tr'); (rows.shift() || []).forEach(v => { const th = document.createElement('th'); th.textContent = v; header.append(th); }); head.append(header); table.append(head);
        const tbody = document.createElement('tbody'); rows.forEach(row => { const tr = document.createElement('tr'); row.forEach(v => { const td = document.createElement('td'); td.textContent = v; tr.append(td); }); tbody.append(tr); }); table.append(tbody); wrap.append(table); card.append(wrap);
      }
      flushPlain();
      if (isUser) card.querySelector('.copy').addEventListener('click', async (event) => {
        await navigator.clipboard.writeText(body);
        event.currentTarget.textContent = 'Copied';
        setTimeout(() => event.currentTarget.textContent = 'Copy Prompt', 1500);
      });
      root.append(card);
    }
    try {
      const bytes = Uint8Array.from(atob(window.transcriptBase64), character => character.charCodeAt(0));
      const text = new TextDecoder().decode(bytes);
      root.replaceChildren();
      const chunks = text.split(/\r?\n---\r?\n(?=(?:You|ChatGPT):\r?\n)/);
      for (const chunk of chunks) {
        const hit = chunk.match(/^(You|ChatGPT):\r?\n([\s\S]*)$/);
        if (hit) addMessage(hit[1], hit[2]);
        else addMessage('Text', chunk);
      }
    } catch { root.innerHTML = '<p class="loading">The transcript could not be loaded.</p>'; }
  </script>
</body>
</html>
